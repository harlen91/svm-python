[project]
name = "svm-python"
version = "0.1.0"
description = "Prediksi Kelulusan Menggunakan SVM"
readme = "README.md"
requires-python = ">=3.10"
dependecies = [
    "fastapi[standard]",
    "pydantic",
    "joblib",
    "scikit-learn",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

#beritahu file yang hasil di masukkan ke package cloude
[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "model.pkl",
]